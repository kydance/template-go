# Logger configuration under KLOG key
KLOG:
  prefix: "ZIWI_"
  directory: "/Users/kyden/git-space/template-go/logs"
  filename: "ziwi"
  level: "debug"
  format: "console"
  time_layout: "2006-01-02 15:04:05.000"

  # Basic settings
  disable_caller: false
  disable_stacktrace: false
  disable_split_error: false

  # File rotation
  max_size: 100
  max_backups: 5
  compress: true

  # Console output control
  console_output: true

  # Sampling (reduces log volume in high-traffic scenarios)
  enable_sampling: false
  sample_initial: 100
  sample_thereafter: 1000

Redis:
  host: 127.0.0.1
  port: 6379
  password: ""
  pool_size: 100
  max_idle: 10
